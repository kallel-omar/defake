parameters:
    env(SERPER_API_KEY): ''
    env(APIFY_API_TOKEN): ''
    env(GROQ_API_KEY): ''
    env(GROQ_MODEL): ''
    env(RESET_PASSWORD_FROM_EMAIL): ''
    env(RESET_PASSWORD_FROM_NAME): 'DeFake'

    serper_api_key: '%env(SERPER_API_KEY)%'
    apify_api_token: '%env(APIFY_API_TOKEN)%'
    reset_password_from_email: '%env(RESET_PASSWORD_FROM_EMAIL)%'
    reset_password_from_name: '%env(RESET_PASSWORD_FROM_NAME)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $serperApiKey: '%serper_api_key%'
            string $resetPasswordFromEmail: '%reset_password_from_email%'
            string $resetPasswordFromName: '%reset_password_from_name%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\ApifyFacebookExtractorService:
        arguments:
            $apifyApiToken: '%apify_api_token%'

    App\Service\AnalysisAvailabilityService:
        arguments:
            $serperApiKey: '%serper_api_key%'
            $apifyApiToken: '%apify_api_token%'
            $groqApiKey: '%env(GROQ_API_KEY)%'
            $groqModel: '%env(GROQ_MODEL)%'

    App\Service\GroqAiService:
        arguments:
            $groqApiKey: '%env(GROQ_API_KEY)%'
            $groqModel: '%env(GROQ_MODEL)%'
